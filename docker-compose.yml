services:
  db:
    image: postgres:18
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build: .
    command: uvicorn src.main:app --reload --host 0.0.0.0
    ports: 
    - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - .:/app:Z
    depends_on:
      - db
    restart: on-failure
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
volumes:
  postgres_data: